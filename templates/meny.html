{% extends "base.html" %}

{% block title %}Meny{% endblock %}

{% block content %}
<h1 class="hovedtext marginleft">Dagens rett</h1>
<div class="menyretter">
    <div class="boxcolumn beegmarginbottom border mainbox">
        <h1 class="hovedtext">{{menyliste[dagnummer]["dag"]}}</h1>
        <img class="dagensrett" src="{{ url_for ('static', filename=menyliste[dagnummer]['img'])}}" alt="{{menyliste[dagnummer]['img']}}">
        <h2 class="text">{{menyliste[dagnummer]["rett"]}}</h2>
    </div>
    <div class="andredager marginbottom">
        {% for list in videreliste %}
        <div class="dagbox boxcolumn thinborder">
            <h2 class="text">{{list["dag"]}}</h2>
            <img class="dagrett" src="{{ url_for ('static', filename=list['img'])}}" alt="{{list['img']}}">
            <h3 class="text">{{list["rett"]}}</h3>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
