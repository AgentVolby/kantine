<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for ('static', filename='style.css') }}">
</head>
<body>
    <nav class="topbar">
        <div class="undertopbar">
            <div class="topbaritems">
                <div class="imgframe">
                    <a href="/">
                        <img id="logo" src="{{ url_for ('static', filename='akademiet.png') }}" alt="akademietlogo">
                    </a>
                </div>
                <a class="textlink" href="/meny">Meny</a>
                <a class="textlink" href="/varer">Varer</a>
                <a class="textlink" href="/kontakt">Kontakt</a>
            </div>
        </div>
    </nav>
    {% block content %}{% endblock %}
    <footer>
        <nav class="bottombar">
            <h1 class="textlink2">Kontakt oss</h1>
            <a class="textlink2 hover2" href="/kontakt">Kontakt</a>
            <a href="https://www.akademiet.no">
                <img id="logo2" src="{{ url_for ('static', filename='akademiet2.png') }}" alt="akademietlogo">
            </a>
        </nav>
    </footer>
    
</body>
</html>
