<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for ('static', filename='style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <nav class="topbar">
        <div class="undertopbar">
            <div class="topbaritems">
                <div class="imgframe">
                    <a href="/">
                        <img id="logo" src="{{ url_for ('static', filename='akademiet.png') }}" alt="akademietlogo">
                    </a>
                </div>
                <a class="text textlink orange" href="/meny">Meny</a>
                <a class="text textlink orange" href="/varer">Varer</a>
                <a class="text textlink orange" href="/kontakt">Kontakt</a>
            </div>
        </div>
    </nav>
    {% block content %}{% endblock %}
    <footer>
        <nav class="bottombar">
            <h1 class="text2">Kontakt oss</h1>
            <a class="text2 textlink hover2 white" href="/kontakt">Kontakt</a>
            <a class="boxcolumn margintop" href="https://www.akademiet.no">
                <img id="logo2" src="{{ url_for ('static', filename='akademiet2.png') }}" alt="akademietlogo">
            </a>
        </nav>
    </footer>
</body>
</html>
